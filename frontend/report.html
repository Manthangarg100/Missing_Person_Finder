<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Missing | FindTrace</title>
  <link rel="stylesheet" href="css/report.css"/>
</head>
<body>

<nav class="navbar">
  <div class="logo">
    <span class="logo-dot"></span>
    <span>FINDTRACE<br><small>MISSING PERSON FINDER</small></span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li class="nav-btn"><a href="report.html">Report Missing</a></li>
  </ul>
</nav>

<section class="report-page">
  <div class="report-card">

    <h1>Report a Missing Person</h1>

    <form class="report-form" onsubmit="submitReport(event)">

      <div class="form-group">
        <label>Full Name</label>
        <input id="name" type="text" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Age</label>
          <input id="age" type="number" required />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Upload Photograph</label>
        <input id="photo" type="file" accept="image/*" required />
      </div>

      <button type="submit" class="submit-btn">
        Submit Report →
      </button>

    </form>

  </div>
</section>

<script>
async function submitReport(e) {
  e.preventDefault();

  const formData = new FormData();
  formData.append("name", document.getElementById("name").value);
  formData.append("age", document.getElementById("age").value);
  formData.append("gender", document.getElementById("gender").value);
  formData.append("image", document.getElementById("photo").files[0]);

  try {
    const res = await fetch("http://127.0.0.1:8001/report-missing", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      alert("❌ " + data.error);
      return;
    }

    alert("✅ Missing person reported successfully");
    document.querySelector(".report-form").reset();

  } catch (err) {
    alert("❌ Cannot connect to backend");
  }
}
</script>

</body>
</html>
