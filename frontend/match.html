<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Match People | FindTrace</title>
  <link rel="stylesheet" href="css/match.css"/>

  <style>
    .result-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .verify-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }
    .verify-buttons button {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .yes-btn { background: #28a745; color: white; }
    .no-btn { background: #dc3545; color: white; }
    .person-label {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .explanation {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 8px;
      line-height: 1.4;
    }
    .demo-note {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <span class="logo-dot"></span>
    <span>FINDTRACE<br><small>MISSING PERSON FINDER</small></span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li class="nav-btn"><a href="report.html">Report Missing</a></li>
  </ul>
</nav>

<section class="match-page">
  <div class="container">

    <div class="header">
      <h1>AI Match</h1>
      <p>Upload an image to match against reported missing persons</p>
    </div>

    <div class="upload-card">
      <input id="matchImage" type="file" accept="image/*" />
      <button class="analyze-btn" id="analyzeBtn">Analyze Image →</button>
      <p id="status"></p>
    </div>

    <div class="results hidden">
      <h2>Potential Matches</h2>
      <div class="result-grid"></div>
    </div>

    <p class="demo-note">
      ⚠️ AI results are simulated for MVP demo. Full AI backend implemented using DeepFace & Gemini.
    </p>

  </div>
</section>

<script type="module">
import { DEMO_MODE } from "./js/config.js";

const analyzeBtn = document.getElementById("analyzeBtn");
analyzeBtn.addEventListener("click", analyze);

async function analyze() {
  const fileInput = document.getElementById("matchImage");
  const file = fileInput.files[0];

  if (!file) {
    alert("Please upload an image");
    return;
  }

  const previewURL = URL.createObjectURL(file);
  document.getElementById("status").innerText = "⏳ Analyzing with AI...";

  // Simulated AI delay
  await new Promise(res => setTimeout(res, 1500));

  const data = {
    matches: [
      {
        id: "mp001",
        name: "Rahul Sharma",
        confidence: 88.7,
        explanation:
          "High facial similarity detected. Results may vary due to lighting and pose. Human verification is recommended."
      },
      {
        id: "mp002",
        name: "Amit Verma",
        confidence: 64.3,
        explanation:
          "Moderate similarity detected. Image quality and partial facial visibility may affect accuracy."
      }
    ]
  };

  const resultsDiv = document.querySelector(".results");
  const grid = document.querySelector(".result-grid");

  resultsDiv.classList.remove("hidden");
  grid.innerHTML = "";
  document.getElementById("status").innerText = "";

  data.matches.forEach(m => {
    const level =
      m.confidence >= 80 ? "high" :
      m.confidence >= 60 ? "medium" : "low";

    grid.innerHTML += `
      <div class="result-card">
        <img src="${previewURL}" class="result-img" />

        <h3>${m.name}</h3>
        <div class="person-label">Reported Missing Person</div>

        <div class="percent ${level}">
          ${m.confidence}%
        </div>

        <p class="explanation">${m.explanation}</p>

        <div class="verify-buttons">
          <button class="yes-btn" onclick="alert('✅ Match confirmed by human')">YES</button>
          <button class="no-btn" onclick="alert('❌ Match rejected by human')">NO</button>
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
